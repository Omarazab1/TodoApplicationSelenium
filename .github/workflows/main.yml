

name: Run Selenium Test

on:
  push:
   branches:
     - "master"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: "21"
          cache: maven
          distribution: ''
      - uses: browser-actions/setup-chrome@v2
      - run: mvn clean test